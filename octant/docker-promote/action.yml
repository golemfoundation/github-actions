name: 'Docker Image Promote'
description: 'Promote (copy) a Docker image between registries'

inputs:
  source-registry:
    description: 'Source registry URL'
    required: true
  source-image:
    description: 'Source image name (without registry)'
    required: true
  source-tag:
    description: 'Source image tag'
    required: true
  source-gcp-service-account:
    description: 'GCP service account for source registry (base64 encoded JSON). Legacy auth — use source-wif-* instead.'
    required: false
    default: ''
  source-wif-provider:
    description: 'GCP WIF provider for source registry'
    required: false
    default: ''
  source-wif-service-account:
    description: 'GCP service account email to impersonate via WIF for source registry'
    required: false
    default: ''
  target-registry:
    description: 'Target registry URL'
    required: true
  target-image:
    description: 'Target image name (without registry)'
    required: true
  target-tag:
    description: 'Target image tag'
    required: true
  target-gcp-service-account:
    description: 'GCP service account for target registry (base64 encoded JSON). Legacy auth — use target-wif-* instead.'
    required: false
    default: ''
  target-wif-provider:
    description: 'GCP WIF provider for target registry'
    required: false
    default: ''
  target-wif-service-account:
    description: 'GCP service account email to impersonate via WIF for target registry'
    required: false
    default: ''
  verify-signature:
    description: 'Verify source image signature before promoting'
    required: false
    default: 'true'
  sign:
    description: 'Sign the promoted image'
    required: false
    default: 'true'
  signature-issuer:
    description: 'Expected OIDC issuer for signature verification'
    required: false
    default: 'https://token.actions.githubusercontent.com'
  signature-identity-regexp:
    description: 'Expected identity regexp for signature verification'
    required: false
    default: ''

outputs:
  digest:
    description: 'Promoted image digest'
    value: ${{ steps.digest.outputs.digest }}
  image-ref:
    description: 'Full promoted image reference'
    value: ${{ inputs.target-registry }}/${{ inputs.target-image }}:${{ inputs.target-tag }}
  image-with-digest:
    description: 'Full promoted image reference with digest'
    value: ${{ inputs.target-registry }}/${{ inputs.target-image }}@${{ steps.digest.outputs.digest }}

runs:
  using: 'composite'
  steps:
    - name: Validate auth inputs
      shell: bash
      env:
        SRC_SA: ${{ inputs.source-gcp-service-account }}
        SRC_WIF_P: ${{ inputs.source-wif-provider }}
        SRC_WIF_SA: ${{ inputs.source-wif-service-account }}
        TGT_SA: ${{ inputs.target-gcp-service-account }}
        TGT_WIF_P: ${{ inputs.target-wif-provider }}
        TGT_WIF_SA: ${{ inputs.target-wif-service-account }}
      run: |
        if [[ -z "$SRC_WIF_SA" || -z "$SRC_WIF_P" ]]; then
          if [[ -z "$SRC_SA" ]]; then
            echo "::error::Provide source-gcp-service-account OR (source-wif-provider + source-wif-service-account)"
            exit 1
          fi
        fi
        if [[ -z "$TGT_WIF_SA" || -z "$TGT_WIF_P" ]]; then
          if [[ -z "$TGT_SA" ]]; then
            echo "::error::Provide target-gcp-service-account OR (target-wif-provider + target-wif-service-account)"
            exit 1
          fi
        fi

    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: 'v2.6.3'

    - name: Setup isolated Docker config
      shell: bash
      run: |
        mkdir -p ${RUNNER_TEMP}/.docker
        echo "DOCKER_CONFIG=${RUNNER_TEMP}/.docker" >> $GITHUB_ENV

    # ── Source auth + docker login ───────────────────────────────────────
    - name: Authenticate to GCP for source (WIF)
      if: inputs.source-wif-service-account != ''
      id: src-auth
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.source-wif-provider }}
        service_account: ${{ inputs.source-wif-service-account }}
        token_format: access_token

    - name: Login to source registry (WIF)
      if: inputs.source-wif-service-account != ''
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
      with:
        registry: ${{ inputs.source-registry }}
        username: oauth2accesstoken
        password: ${{ steps.src-auth.outputs.access_token }}

    - name: Login to source registry (SA key)
      if: inputs.source-wif-service-account == ''
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
      with:
        registry: ${{ inputs.source-registry }}
        username: _json_key_base64
        password: ${{ inputs.source-gcp-service-account }}

    - name: Verify source image signature
      if: inputs.verify-signature == 'true'
      shell: bash
      env:
        SOURCE_IMAGE: ${{ inputs.source-registry }}/${{ inputs.source-image }}:${{ inputs.source-tag }}
        ISSUER: ${{ inputs.signature-issuer }}
        IDENTITY_REGEXP: ${{ inputs.signature-identity-regexp }}
      run: |
        echo "Verifying signature for ${SOURCE_IMAGE}..."
        VERIFY_ARGS="--certificate-oidc-issuer ${ISSUER}"
        if [[ -n "$IDENTITY_REGEXP" ]]; then
          VERIFY_ARGS="${VERIFY_ARGS} --certificate-identity-regexp ${IDENTITY_REGEXP}"
        fi
        cosign verify ${VERIFY_ARGS} "${SOURCE_IMAGE}"

    # ── Target auth + docker login (done last so gcloud is authed as target) ──
    - name: Authenticate to GCP for target (WIF)
      if: inputs.target-wif-service-account != ''
      id: tgt-auth
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.target-wif-provider }}
        service_account: ${{ inputs.target-wif-service-account }}
        token_format: access_token

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

    - name: Login to target registry (WIF)
      if: inputs.target-wif-service-account != ''
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
      with:
        registry: ${{ inputs.target-registry }}
        username: oauth2accesstoken
        password: ${{ steps.tgt-auth.outputs.access_token }}

    - name: Login to target registry (SA key)
      if: inputs.target-wif-service-account == ''
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
      with:
        registry: ${{ inputs.target-registry }}
        username: _json_key_base64
        password: ${{ inputs.target-gcp-service-account }}

    - name: Copy image to target registry
      shell: bash
      env:
        SOURCE_IMAGE: ${{ inputs.source-registry }}/${{ inputs.source-image }}:${{ inputs.source-tag }}
        TARGET_IMAGE: ${{ inputs.target-registry }}/${{ inputs.target-image }}:${{ inputs.target-tag }}
      run: |
        echo "Copying ${SOURCE_IMAGE} to ${TARGET_IMAGE}..."
        cosign copy -f "${SOURCE_IMAGE}" "${TARGET_IMAGE}"

    - name: Authenticate gcloud for artifact queries (SA key)
      if: inputs.target-wif-service-account == ''
      shell: bash
      env:
        GCP_SA_KEY: ${{ inputs.target-gcp-service-account }}
      run: |
        echo "${GCP_SA_KEY}" | base64 -d > ${RUNNER_TEMP}/target-key.json
        gcloud auth activate-service-account --key-file=${RUNNER_TEMP}/target-key.json

    - name: Get image digest
      id: digest
      shell: bash
      env:
        TARGET_IMAGE: ${{ inputs.target-registry }}/${{ inputs.target-image }}:${{ inputs.target-tag }}
      run: |
        DIGEST=$(gcloud artifacts docker images describe "${TARGET_IMAGE}" --format='value(image_summary.digest)')
        echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
        echo "Image digest: ${DIGEST}"

    - name: Sign the promoted image
      if: inputs.sign == 'true'
      shell: bash
      env:
        TARGET_IMAGE: ${{ inputs.target-registry }}/${{ inputs.target-image }}:${{ inputs.target-tag }}
        DIGEST: ${{ steps.digest.outputs.digest }}
      run: |
        echo "Signing ${TARGET_IMAGE}@${DIGEST}..."
        cosign sign --yes "${TARGET_IMAGE}@${DIGEST}"
