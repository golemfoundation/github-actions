name: 'Docker Build and Sign'
description: 'Build, push, and sign a Docker image'

inputs:
  registry:
    description: 'Docker registry URL'
    required: true
  image-name:
    description: 'Image name (without registry prefix)'
    required: true
  image-tag:
    description: 'Image tag'
    required: true
  context:
    description: 'Docker build context path'
    required: false
    default: '.'
  dockerfile:
    description: 'Dockerfile path'
    required: false
    default: 'Dockerfile'
  build-args:
    description: 'Build arguments (multiline KEY=VALUE)'
    required: false
    default: ''
  build-secrets:
    description: 'Build secrets (multiline KEY=VALUE)'
    required: false
    default: ''
  gcp-service-account:
    description: 'GCP service account key (base64 encoded JSON). Legacy auth — use wif-* inputs instead.'
    required: false
    default: ''
  wif-provider:
    description: 'GCP Workload Identity Federation provider (e.g. projects/123/locations/global/workloadIdentityPools/foo/providers/bar)'
    required: false
    default: ''
  wif-service-account:
    description: 'GCP service account email to impersonate via WIF'
    required: false
    default: ''
  cache-image:
    description: 'Cache image reference'
    required: false
    default: ''
  sign:
    description: 'Whether to sign the image with Cosign'
    required: false
    default: 'true'

outputs:
  digest:
    description: 'Image digest'
    value: ${{ steps.build.outputs.digest }}
  image-ref:
    description: 'Full image reference with tag'
    value: ${{ steps.meta.outputs.tags }}
  image-with-digest:
    description: 'Full image reference with digest'
    value: ${{ inputs.registry }}/${{ inputs.image-name }}@${{ steps.build.outputs.digest }}

runs:
  using: 'composite'
  steps:
    - name: Validate auth inputs
      shell: bash
      env:
        SA: ${{ inputs.gcp-service-account }}
        WIF_P: ${{ inputs.wif-provider }}
        WIF_SA: ${{ inputs.wif-service-account }}
      run: |
        if [[ -n "$WIF_SA" && -n "$WIF_P" ]]; then
          echo "auth: WIF (${WIF_SA})"
        elif [[ -n "$SA" ]]; then
          echo "auth: SA key (legacy)"
        else
          echo "::error::Provide either gcp-service-account OR (wif-provider + wif-service-account)"
          exit 1
        fi

    - name: Install Cosign
      if: inputs.sign == 'true'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: 'v2.6.3'

    - name: Setup isolated Docker config
      shell: bash
      run: |
        mkdir -p ${RUNNER_TEMP}/.docker
        echo "DOCKER_CONFIG=${RUNNER_TEMP}/.docker" >> $GITHUB_ENV

    - name: Authenticate to GCP (WIF)
      if: inputs.wif-service-account != ''
      id: wif-auth
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.wif-provider }}
        service_account: ${{ inputs.wif-service-account }}
        token_format: access_token

    - name: Login to Docker registry (WIF)
      if: inputs.wif-service-account != ''
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
      with:
        registry: ${{ inputs.registry }}
        username: oauth2accesstoken
        password: ${{ steps.wif-auth.outputs.access_token }}

    - name: Login to Docker registry (SA key)
      if: inputs.wif-service-account == ''
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
      with:
        registry: ${{ inputs.registry }}
        username: _json_key_base64
        password: ${{ inputs.gcp-service-account }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
      with:
        images: ${{ inputs.registry }}/${{ inputs.image-name }}
        tags: type=raw,value=${{ inputs.image-tag }}

    - name: Build and push container image
      id: build
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.context }}/${{ inputs.dockerfile }}
        secrets: ${{ inputs.build-secrets }}
        build-args: ${{ inputs.build-args }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: ${{ inputs.cache-image != '' && format('type=registry,ref={0}', inputs.cache-image) || '' }}
        cache-to: ${{ inputs.cache-image != '' && format('type=registry,ref={0},mode=max', inputs.cache-image) || '' }}

    - name: Sign the image with GitHub OIDC Token
      if: inputs.sign == 'true'
      shell: bash
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
        TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        images=""
        for tag in ${TAGS}; do
          images+="${tag}@${DIGEST} "
        done
        echo "Signing images: $images"
        cosign sign --yes ${images}
