name: 'Node.js and Yarn Setup'
description: 'Setup Node.js with Corepack, configure npm auth for private packages, and install dependencies'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22'
  npm-auth-token:
    description: 'NPM auth token for private @golemfoundation packages'
    required: false
    default: ''
  install-dependencies:
    description: 'Run yarn install --immutable'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Enable Corepack (and setup Yarn)
      shell: bash
      run: |
        if ! jq -e '.packageManager' package.json > /dev/null 2>&1; then
          echo "::error::package.json must contain a 'packageManager' field (e.g. \"packageManager\": \"yarn@4.0.0\")"
          exit 1
        fi
        corepack enable

    - name: Set npm auth token
      if: inputs.npm-auth-token != ''
      shell: bash
      env:
        NPM_AUTH_TOKEN: ${{ inputs.npm-auth-token }}
      run: |
        yarn config set -H npmScopes.golemfoundation.npmAuthToken "${NPM_AUTH_TOKEN}"

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: yarn install --immutable
